<script id="appData" type="application/json">{"bank":[{"id":"A1","day":1,"order":0,"category":"A","topic":"Agent","title":"什么是 Agent？与大模型有什么本质不同？","difficulty":"基础","must":true,"focus":"考察你能否解释什么是 Agent？与大模型有什么本质不同？ 重点应说清「Agent 是目标驱动且能自主决定下一步行动的系统」，并补充真实项目中的具体取舍。","points":["Agent 是目标驱动且能自主决定下一步行动的系统","组件包含模型规划、工具执行、状态记忆、结果反馈","区别于单次 LLM 输出，它形成感知—行动—反馈闭环","生产环境必须设置权限、预算与终止条件"],"answer":"Agent 是目标驱动且能自主决定下一步行动的系统；组件包含模型规划、工具执行、状态记忆、结果反馈；区别于单次 LLM 输出，它形成感知—行动—反馈闭环；生产环境必须设置权限、预算与终止条件。","keywords":["自主","规划","反馈","工具"],"source":"https://xiaolinnote.com/ai/agent/1_whatisagent.html","sourceDetail":true,"quiz":{"prompt":"用户要求“核对 3 个竞品报价并生成报告”。下面哪种行为最能体现 Agent 的核心特征？","options":["模型一次性根据记忆写出报告","模型先检索、核对结果，再决定是否继续查询并最终生成报告","仅向模型加上更长的系统提示词","把工具 Schema 打印给用户"],"correct":1,"why":"Agent 的核心是围绕目标持续决策并根据工具观察进行反馈，不是单纯生成更长的回答。","follow":"如果检索工具连续失败三次，你会怎样设计 Agent 的重试、预算和终止策略？"},"verifiedLink":true,"sourceStatus":"原题文章入口","brief":"Agent 是目标驱动且能自主决定下一步行动的系统；组件包含模型规划、工具执行、状态记忆、结果反馈；区别于单次 LLM 输出，它形成感知—行动—反馈闭环；生产环境必须设置权限、预算与终止条件。","sourcesite":"小林面试笔记","lesson":{"intro":"面试官想问的不是“你有没有给 LLM 接工具”，而是：系统能否在目标不变的情况下，依据中间结果自主决定下一步。Agent 是一种系统架构，底层语言模型只负责产生候选计划或下一步行动；运行时负责执行、验证与持久化。","steps":[["目标与状态","用户给的是目标而非逐步脚本。运行时保存任务目标、当前步骤、已完成动作与失败信息，避免多轮执行丢上下文。"],["计划与决策","模型结合当前观察，决定下一步：检索、调用 API、追问用户或完成任务。不是每次都必须由模型决定，固定环节仍可用代码控制。"],["执行与反馈","工具实际由宿主应用执行；API 返回的真实数据和失败状态写回运行时，再参与下一轮决策。"],["守护与收敛","最大调用次数、Token 预算、超时、权限审批、成功判定和人工中断，都是防止 Agent 无限尝试的工程边界。"]],"case":"例如“查三家 SaaS 产品价格并产出比较表”：先搜索、提取价格、检查日期与出处；某来源不可靠时重新检索，找不到则说明不确定，而不是虚构数据。","misconception":"“能 Function Calling 的 LLM 就必然是 Agent”是错误的。一次工具调用未必包含持续的规划、观察和反馈；另外也不能把是否自动执行敏感操作当作智能程度的证明。","proof":"回答必须点出自主决策、真实工具执行与基于观察修正的闭环；原文着重强调“自主闭环”，且区分模型决策与代码执行。"}},{"id":"R1","day":1,"order":1,"category":"R","topic":"RAG","title":"RAG 是什么？完整工作流程如何设计？","difficulty":"基础","must":true,"focus":"考察你能否解释RAG 是什么？完整工作流程如何设计？ 重点应说清「离线加载文档并清洗、切块、Embedding、建立索引」，并补充真实项目中的具体取舍。","points":["离线加载文档并清洗、切块、Embedding、建立索引","在线对 Query 改写后做向量或混合检索并精排","将可信文档片段与问题交给 LLM 生成答案","结合引用、权限控制与评测降低无依据回答"],"answer":"离线加载文档并清洗、切块、Embedding、建立索引；在线对 Query 改写后做向量或混合检索并精排；将可信文档片段与问题交给 LLM 生成答案；结合引用、权限控制与评测降低无依据回答。","keywords":["切块","Embedding","检索","重排"],"source":"https://xiaolinnote.com/ai/rag/1_whatisrag.html","sourceDetail":true,"quiz":{"prompt":"公司内部知识库每天更新，用户查询需要附来源。最合理的系统链路是？","options":["先微调模型，再直接回复，不检索","将整库所有文件拼到 Prompt 中","离线分块建索引，在线召回 + 重排 + 基于证据生成","只用 BM25，始终不需要重排或引用"],"correct":2,"why":"标准 RAG 将离线知识索引与在线检索生成分开，并可添加混合检索、精排与引用。","follow":"一个查询召回了正确文档，但答案仍错误，你会分别排查哪三个环节？"},"verifiedLink":true,"sourceStatus":"原题文章入口","brief":"离线加载文档并清洗、切块、Embedding、建立索引；在线对 Query 改写后做向量或混合检索并精排；将可信文档片段与问题交给 LLM 生成答案；结合引用、权限控制与评测降低无依据回答。","sourcesite":"小林面试笔记","lesson":{"intro":"RAG 的关键不是“找一些文档喂给模型”，而是可靠地把外部证据放到生成之前，让知识可以更新、权限可以校验、答案可以追溯。你要分别讲清离线建索引和在线查询。","steps":[["离线清洗","从 PDF、网页、数据库读取数据，保留标题、权限、版本、来源；清洗噪声，按结构/语义切块，必要时保留重叠上下文。"],["向量表示","用 Embedding 把文本变成可比较的稠密向量，存入索引；常常同时建 BM25 关键词索引以处理精确术语和编号。"],["在线召回","对 Query 做澄清或改写，执行向量检索 + 关键词检索，再用元数据权限过滤和 Reranker 提升 Top-K 证据质量。"],["证据生成与评估","将最相关片段及出处组成上下文；模型基于证据作答，找不到则拒答；分别评估检索召回率、证据忠实度和答案正确率。"]],"case":"企业制度库中问“2026 版差旅报销上限”：不仅要搜到相关 PDF，还要筛选版本与适用地区；旧版文档即使语义相近，也不能用于最终结论。","misconception":"向量相似度并不代表事实权威，也不能靠无限增加 chunk 数修复错误答案。真实工程必须处理版本、权限、多文档冲突及引用。","proof":"完整回答需说明文档解析→切块→Embedding→存储→检索→重排→上下文生成→引用与评测；原文围绕整个处理链路展开。"}},{"id":"T1","day":1,"order":2,"category":"T","topic":"工具调用","title":"什么是 Function Calling？原理是什么？","difficulty":"基础","must":true,"focus":"考察你能否解释什么是 Function Calling？原理是什么？ 重点应说清「开发者提供工具名称、用途和参数 Schema」，并补充真实项目中的具体取舍。","points":["开发者提供工具名称、用途和参数 Schema","模型返回结构化 tool call，但不会直接执行代码","宿主校验参数及权限后调用真实 API，并把工具结果回传模型","工程中必须处理失败、超时和重复副作用"],"answer":"开发者提供工具名称、用途和参数 Schema；模型返回结构化 tool call，但不会直接执行代码；宿主校验参数及权限后调用真实 API，并把工具结果回传模型；工程中必须处理失败、超时和重复副作用。","keywords":["Schema","模型","宿主","回传"],"source":"https://xiaolinnote.com/ai/tools/1_function_calling.html","sourceDetail":true,"quiz":{"prompt":"模型返回 tool_call: send_email({to,body})，下一步应由谁实际发送邮件？","options":["模型权重直接发送网络请求","宿主程序校验权限与参数后执行","Embedding 模型自动调用 SMTP","MCP 协议默认替用户绕过授权"],"correct":1,"why":"模型输出调用意图，不会凭空产生真实副作用；真实执行与鉴权属于宿主程序。","follow":"支付工具超时后，如何避免“重试”造成重复扣款？"},"verifiedLink":true,"sourceStatus":"原题文章入口","brief":"开发者提供工具名称、用途和参数 Schema；模型返回结构化 tool call，但不会直接执行代码；宿主校验参数及权限后调用真实 API，并把工具结果回传模型；工程中必须处理失败、超时和重复副作用。","sourcesite":"小林面试笔记","lesson":{"intro":"Function Calling 解决的是“模型如何以机器可解析的格式发起行动请求”。模型输出 tool call 只是调用意图，不会直接让邮件发送、数据库修改或退款真的发生。","steps":[["定义工具契约","向模型注册工具名称、说明、输入参数类型和必填字段，Schema 负责约束结构，但不等于后端自动完成安全检查。"],["模型产生调用","模型根据问题返回工具名称与结构化参数；有的模型/接口支持多工具并行调用，具体取决于实现。"],["宿主执行","后端校验参数、授权、限流和幂等键，通过真实 API/函数执行，捕获超时与外部错误。"],["结果反馈","用 tool result 消息返回真实结果及对应 tool_call_id，模型再解释结果、决定是否继续，直到生成最终回答。"]],"case":"“帮用户退一笔订单”：模型可以建议调用退款工具，但服务端必须查询订单归属与退款资格，且对退款进行幂等处理和必要的人为确认。","misconception":"不要把“参数符合 JSON Schema”等同于“业务允许执行”；也不能模型说“完成了”就算执行成功，必须有工具侧确认凭证。","proof":"原文讲解了工具 Schema、tool_calls、宿主执行与结果回传；关键结论是模型负责决策，程序负责执行。"}},{"id":"H2","day":1,"order":3,"category":"H","topic":"LangChain","title":"LangChain 中 Chain 的核心作用及 LCEL 是什么？","difficulty":"基础","must":false,"focus":"考察你能否解释LangChain 中 Chain 的核心作用及 LCEL 是什么？ 重点应说清「Chain 是将提示词、模型、解析等步骤组织成可复用数据流」，并补充真实项目中的具体取舍。","points":["Chain 是将提示词、模型、解析等步骤组织成可复用数据流","Runnable 提供统一的 invoke、batch 和 stream 接口","LCEL 用竖线组合 Runnable 并便于复用","复杂循环、有状态和人工中断场景通常改用 LangGraph"],"answer":"Chain 是将提示词、模型、解析等步骤组织成可复用数据流；Runnable 提供统一的 invoke、batch 和 stream 接口；LCEL 用竖线组合 Runnable 并便于复用；复杂循环、有状态和人工中断场景通常改用 LangGraph。","keywords":["Chain","Runnable","LCEL","LangGraph"],"source":"https://xiaolinnote.com/ai/langchain/chain.html","sourceDetail":true,"quiz":{"prompt":"你想依次执行 Prompt → LLM → JSON Parser，且需要批处理与流式输出。应优先使用？","options":["手动拼字符串，不需要组件接口","Runnable 和 LCEL 的组合","只用向量数据库代替模型","每次都启用 Multi-Agent 才能串联"],"correct":1,"why":"Runnable 是可执行组件接口，LCEL 可组合链路并提供统一 invoke/batch/stream 行为。","follow":"为何多轮有状态任务常用 LangGraph，而不是只写一条 LCEL 链？"},"verifiedLink":true,"sourceStatus":"原题文章入口","brief":"Chain 是将提示词、模型、解析等步骤组织成可复用数据流；Runnable 提供统一的 invoke、batch 和 stream 接口；LCEL 用竖线组合 Runnable 并便于复用；复杂循环、有状态和人工中断场景通常改用 LangGraph。","sourcesite":"小林面试笔记","lesson":{"intro":"现代 LangChain 的主线是 Runnable 可组合协议，Chain 表达应用的数据流；LCEL 则是用管道运算符把这些步骤连起来的声明式语法。理解三者分工，比背老类名更有用。","steps":[["Chain 定义","把 Prompt、Retriever、LLM、Output Parser 等独立步骤按输入输出连成数据流。"],["Runnable 协议","统一 invoke / ainvoke、batch、stream 等接口，单个组件与组合后的链都可以继续复用。"],["LCEL 组合","prompt | model | parser 形成顺序执行链；字典或 RunnableParallel 用于并行输入准备。"],["版本与边界","旧式 LLMChain、SequentialChain 属于 legacy；复杂有状态循环、持久化和人工审批，使用 LangGraph 通常更合适。"]],"case":"搭建“检索 FAQ 并生成结构化 JSON”的固定流程：Retriever → Prompt → Chat Model → JsonOutputParser；若需动态决定“查库还是调用工单”，再引入 Agent。","misconception":"不要把 LCEL 当成只能顺序运行的字符串拼接，更不能在新版本仍把 LLMChain 当默认首选。流式能力也取决于链中各组件实现。","proof":"原文明确 Chain 是编排理念、Runnable 是统一执行协议、LCEL 是组合语法，并特别解释了新旧版本 API 的差异。"}},{"id":"L2","day":1,"order":4,"category":"L","topic":"LLM 工程","title":"Transformer 基本原理是什么？Encoder 与 Decoder 有何区别？","difficulty":"基础","must":false,"focus":"考察你能否解释Transformer 基本原理是什么？Encoder 与 Decoder 有何区别？ 重点应说清「Transformer 通过自注意力机制计算 Token 依赖，Q、K、V 由输入投影得到」，并补充真实项目中的具体取舍。","points":["Transformer 通过自注意力机制计算 Token 依赖，Q、K、V 由输入投影得到","注意力使用缩放点积和 Softmax 加权聚合信息","Encoder 通常允许双向关注输入","自回归 Decoder 使用因果 Mask，逐 Token 生成"],"answer":"Transformer 通过自注意力机制计算 Token 依赖，Q、K、V 由输入投影得到；注意力使用缩放点积和 Softmax 加权聚合信息；Encoder 通常允许双向关注输入；自回归 Decoder 使用因果 Mask，逐 Token 生成。","keywords":["注意力","QKV","Encoder","Decoder"],"source":"https://xiaolinnote.com/ai/llm/transformer_architecture.html","sourceDetail":true,"quiz":{"prompt":"自回归 Decoder 为什么需要因果 Mask？","options":["限制当前位置访问未来 Token，保证训练生成一致的自回归约束","让每个 Token 都看到后续答案","为了替代 Tokenizer","让 Q、K、V 不再需要线性投影"],"correct":0,"why":"因果掩码避免当前位置注意到未来 Token，从而符合自回归下一个 Token 预测。","follow":"GQA 缓解的是哪个瓶颈？它与 Flash Attention 是否解决同一类问题？"},"verifiedLink":true,"sourceStatus":"原题文章入口","brief":"Transformer 通过自注意力机制计算 Token 依赖，Q、K、V 由输入投影得到；注意力使用缩放点积和 Softmax 加权聚合信息；Encoder 通常允许双向关注输入；自回归 Decoder 使用因果 Mask，逐 Token 生成。","sourcesite":"小林面试笔记","lesson":{"intro":"Transformer 使用自注意力直接计算不同 Token 之间的相关性。Decoder-only GPT 类模型通常以“给定前文，预测下一个 Token”训练，因此必须防止当前位置看到未来信息。","steps":[["Token 与位置","文本先 Tokenize；词嵌入还需补充位置信息，否则序列顺序无法充分区分。"],["Q、K、V","每个 token 的表示分别线性投影为 Query、Key、Value；相似度计算决定从哪些位置读取信息。"],["缩放点积注意力","Attention(Q,K,V)=softmax(QKᵀ/√dₖ)V；多头注意力在不同表示子空间建模。"],["Encoder 与 Decoder","Encoder 常用双向注意力，Decoder 自回归生成常用 causal mask 屏蔽未来 Token；实际模型实现可以包括不同结构。"]],"case":"问“客服模型生成时为什么不能提前读到后面的答案？”：训练使用因果掩码限制未来 Token 的访问，推理时则按 Token 逐步生成。","misconception":"“Encoder 用于理解、Decoder 用于生成”是常见用途，不是数学意义上的绝对限制；复杂度与 KV Cache、FlashAttention 的问题不能混为一谈。","proof":"该题重点是 Self-Attention、Q/K/V、因果 Mask 和两种结构的差异；不应只回答“Transformer 有注意力机制”。"}},{"id":"A2","day":2,"order":0,"category":"A","topic":"Agent","title":"Agent 的基本架构由哪些核心组件构成？","difficulty":"基础","must":true,"focus":"考察你能否解释Agent 的基本架构由哪些核心组件构成？ 重点应说清「常见架构包含 LLM 决策器、工具集、状态和记忆、执行调度器」，并补充真实项目中的具体取舍。","points":["常见架构包含 LLM 决策器、工具集、状态和记忆、执行调度器","模型产生下一步意图，宿主校验参数并调用真实工具","观察结果写回状态，再决定继续或终止","还应有权限审查、超时重试、可追踪日志"],"answer":"常见架构包含 LLM 决策器、工具集、状态和记忆、执行调度器；模型产生下一步意图，宿主校验参数并调用真实工具；观察结果写回状态，再决定继续或终止；还应有权限审查、超时重试、可追踪日志。","keywords":["模型","工具","状态","反馈"],"source":"https://xiaolinnote.com/ai/agent/2_components.html","sourceDetail":false,"verifiedLink":true,"sourceStatus":"原题文章入口（已核对）","brief":"常见架构包含 LLM 决策器、工具集、状态和记忆、执行调度器；模型产生下一步意图，宿主校验参数并调用真实工具；观察结果写回状态，再决定继续或终止；还应有权限审查、超时重试、可追踪日志。","sourcesite":"小林面试笔记","lesson":{"intro":"设计 Agent 时需要同时回答两个问题：智能决策从哪里来，以及执行为什么能可靠地持续进行。经典的四层是 LLM、工具、记忆、规划；生产系统还要显式补上编排运行时和安全治理。","steps":[["LLM 决策层","接收用户目标、上下文和工具反馈，判断当前任务应继续思考、选择工具、请求澄清还是终止。模型选型看推理质量、调用格式稳定性、延迟与成本，不能只看基准榜单。"],["工具执行层","工具 Schema 只是协议描述；执行由宿主代码完成，按真实用户身份鉴权，做好输入校验、超时与幂等控制，并把结果返回模型。"],["记忆与状态层","短期上下文保存当前任务的步骤、工具观察和约束；长期记忆保存需跨任务检索的事实或偏好。大型任务还要用检查点持久化执行进度，支持中断恢复。"],["规划与调度层","把目标拆成步骤、追踪依赖和完成条件。ReAct 允许边观察边计划，Plan-and-Execute 先组织全局方案；实际执行器必须设置预算和最大迭代次数。"],["安全与可观测性","日志/Trace 关联每次模型调用、工具参数与返回结果，敏感动作要求人工批准；出现连续失败、任务偏移或不可验证结果时停止并报告。"]],"case":"一个售后 Agent 需要“查订单→核验退款资格→提请批准→退款→回写工单”：模型负责决策，订单 API 是工具，订单状态与批准记录是任务状态，步骤依赖交给调度器，退款必须幂等并留审计轨迹。","misconception":"把 Memory 简化为“把聊天记录全部塞入 Prompt”会造成上下文膨胀；把 Plan 当成必然要用 LLM 生成也不对，严格合规流程可固定编排，只对不确定部分开放智能决策。","proof":"该题原站从 LLM 核心、工具系统、短期与长期记忆、规划模块四个组件解释 Agent，并讨论模型选择、工具 Schema 和运行时行为。"}},{"id":"C2","day":2,"order":1,"category":"C","topic":"AI 编程","title":"如何向 AI 明确开发需求和验收标准？","difficulty":"基础","must":true,"focus":"考察你能否解释如何向 AI 明确开发需求和验收标准？ 重点应说清「给 AI 提供业务背景、明确的输入输出、不可违反的限制和验收示例」，并补充真实项目中的具体取舍。","points":["给 AI 提供业务背景、明确的输入输出、不可违反的限制和验收示例","列出环境、依赖版本、性能与安全要求","将抽象需求变成可运行测试或检查表","无把握时先要求它提出澄清点和实施方案"],"answer":"给 AI 提供业务背景、明确的输入输出、不可违反的限制和验收示例；列出环境、依赖版本、性能与安全要求；将抽象需求变成可运行测试或检查表；无把握时先要求它提出澄清点和实施方案。","keywords":["需求","约束","验收","测试"],"source":"https://xiaolinnote.com/ai/coding/task_specification.html","sourceDetail":false,"verifiedLink":true,"sourceStatus":"原题文章入口（已核对）","brief":"给 AI 提供业务背景、明确的输入输出、不可违反的限制和验收示例；列出环境、依赖版本、性能与安全要求；将抽象需求变成可运行测试或检查表；无把握时先要求它提出澄清点和实施方案。","sourcesite":"小林面试笔记","lesson":{"intro":"AI 编程最常见的失败不是代码写不出来，而是任务边界没有交代清楚。高质量需求需要从“想做什么”转换成可审计、可测试、可复现的执行契约。","steps":[["业务目标与边界","先给用户故事、场景和不可做的事情。例如只修改订单状态展示，不能更改支付流水或数据库表结构。"],["输入输出与前置条件","明确函数/API 契约、错误码、数据格式、权限身份、依赖模块以及期望的行为样例；让 AI 先复述需求并列出歧义。"],["实现约束与上下文","给出技术栈、版本、代码规范、现有测试、相关文件路径，限制只读目录与可写范围，避免为小改动大范围重构。"],["可验证的验收标准","将“好用”“稳定”转换为确定性的 Given/When/Then 行为示例、边界值、错误路径和性能阈值；测试不应只靠 AI 自己声称通过。"],["分阶段交付","先方案与受影响模块，再小范围修改和单元测试，最后运行静态检查、回归验证和代码差异审查，保留执行证据。"]],"case":"需求“给购物车加优惠券”：不要只给一句话。应说明适用 SKU、互斥规则、用户等级、过期时间、四舍五入、异常码；验收覆盖叠加券、边界金额、并发提交和撤销操作。","misconception":"提示词越长未必越好；把整个仓库无差别塞进去会噪声巨大。更有效的是保留精准约束、相关上下文和独立验收标准，让 Agent 用测试证明，而不是通过口头保证。","proof":"原站围绕“开发目标、限制条件、验收标准”，强调将模糊任务转换为有范围、有依据且可以验证的工程工作。"}},{"id":"L3","day":2,"order":2,"category":"L","topic":"LLM 工程","title":"MHA 有何局限？MQA、GQA、Flash Attention 如何优化？","difficulty":"高级","must":true,"focus":"考察你能否解释MHA 有何局限？MQA、GQA、Flash Attention 如何优化？ 重点应说清「标准多头注意力的 KV Cache 随头数和序列长度增长」，并补充真实项目中的具体取舍。","points":["标准多头注意力的 KV Cache 随头数和序列长度增长","MQA 共享一组 KV，GQA 让多组 Q 共享 KV，减小缓存带宽","Flash Attention 使用分块和内存优化实现精确注意力","应同时比较质量、吞吐与显存"],"answer":"标准多头注意力的 KV Cache 随头数和序列长度增长；MQA 共享一组 KV，GQA 让多组 Q 共享 KV，减小缓存带宽；Flash Attention 使用分块和内存优化实现精确注意力；应同时比较质量、吞吐与显存。","keywords":["MHA","KV","GQA","Flash"],"source":"https://xiaolinnote.com/ai/llm/mha_mqa_gqa_flash_attention.html","sourceDetail":false,"verifiedLink":true,"sourceStatus":"原题文章入口（已核对）","brief":"标准多头注意力的 KV Cache 随头数和序列长度增长；MQA 共享一组 KV，GQA 让多组 Q 共享 KV，减小缓存带宽；Flash Attention 使用分块和内存优化实现精确注意力；应同时比较质量、吞吐与显存。","sourcesite":"小林面试笔记","lesson":{"intro":"MHA、MQA、GQA 和 FlashAttention 不是四种相同层级的结构。前两种和 GQA 改变 KV 头的组织方式，重点解决推理 KV Cache 容量和带宽；FlashAttention 主要优化注意力计算的内存访问实现。","steps":[["MHA 的缓存代价","多头注意力为各个注意力头保留独立 K/V；推理缓存量约与层数、序列长度、KV 头数、head_dim 和数据精度成正比，长上下文或高并发时压力明显。"],["MQA：最小 KV 头数","让所有 Query 头共享一组 Key/Value，明显压缩 KV Cache 和解码带宽，但表达能力可能受到影响，需验证任务质量。"],["GQA：折中分组","将多个 Query 头分配给同一组 KV 头，KV 头数量介于 MQA 与 MHA 之间，在缓存开销与模型效果之间取折中。"],["FlashAttention：IO 优化","通过分块/融合计算与片上存储复用减少 HBM 读写，计算精确 Softmax 注意力（非近似采样），通常降低中间激活内存并提升速度。"],["如何做工程选型","报告峰值显存、KV Cache、P50/P95 延迟、吞吐与任务质量；区分 prefill 与 decode，不要只说“加速了 2 倍”而没有测试环境。"]],"case":"一个 32K 上下文、100 并发的推理服务出现显存瓶颈：优先确认占用是模型权重还是 KV Cache；若 KV 占比高，考虑 GQA/MQA 或 KV 量化；若长序列 prefill 占用大，分析 FlashAttention 与批处理策略。","misconception":"“FlashAttention = GQA 的另一种叫法”是错误的；也不能把训练阶段的激活节省直接等同于解码阶段的 KV Cache 缩减。","proof":"原站按多头注意力的局限、MQA/GQA 的结构压缩、FlashAttention 的计算优化分别拆解，并比较三者解决问题的维度。"}},{"id":"R3","day":2,"order":3,"category":"R","topic":"RAG","title":"RAG 与微调各自优劣势及适用场景是什么？","difficulty":"基础","must":false,"focus":"考察你能否解释RAG 与微调各自优劣势及适用场景是什么？ 重点应说清「RAG 将最新或私有知识外置检索，更新快且可溯源」，并补充真实项目中的具体取舍。","points":["RAG 将最新或私有知识外置检索，更新快且可溯源","微调主要改变模型的行为、格式或领域能力，不是高频知识更新的首选","RAG 有检索质量和延迟成本，微调有数据与训练成本","复杂场景可先 RAG 再按需要微调"],"answer":"RAG 将最新或私有知识外置检索，更新快且可溯源；微调主要改变模型的行为、格式或领域能力，不是高频知识更新的首选；RAG 有检索质量和延迟成本，微调有数据与训练成本；复杂场景可先 RAG 再按需要微调。","keywords":["时效","检索","微调","训练"],"source":"https://xiaolinnote.com/ai/rag/3_rag_vs_finetune.html","sourceDetail":false,"verifiedLink":true,"sourceStatus":"原题文章入口（已核对）","brief":"RAG 将最新或私有知识外置检索，更新快且可溯源；微调主要改变模型的行为、格式或领域能力，不是高频知识更新的首选；RAG 有检索质量和延迟成本，微调有数据与训练成本；复杂场景可先 RAG 再按需要微调。","sourcesite":"小林面试笔记","lesson":{"intro":"RAG 和微调常被放在一起比较，但两者优化的层次不同：RAG 主要向模型提供“回答时需要什么外部证据”，微调主要让模型学会“以什么方式完成任务”，不是一个简单的二选一。","steps":[["RAG 的作用","外置动态知识，通过索引检索提供实时、私有、可引用的上下文；更新文档不用反复改动模型权重，还可结合权限过滤。"],["微调的作用","通过 SFT/LoRA 等训练优化指令遵循、风格、特定输出格式和专业任务能力；并不保证某条经常变化的事实被可靠记住。"],["RAG 的代价","链路增加文档解析、检索、精排、Prompt 组装和证据冲突处理，故障可能来自召回不到、召回错误或模型未按证据回答。"],["微调的代价","需要数据标注、训练与评测资源，容易发生过拟合或遗忘；部署模型版本和回滚也比更新知识库更重。"],["实际组合策略","先问是知识问题还是行为问题：事实更新/可追溯优先 RAG；固定格式/任务能力不足考虑微调；复杂业务两者可以结合并分别评估。"]],"case":"公司制度每周修改并要求逐条引用：先 RAG；如果模型总是不能把答案输出成固定审核 JSON，可增加结构化输出约束，仍不足时再考虑微调。","misconception":"“微调一次就可以把所有企业知识永久装进模型”不成立。RAG 也不会天然消灭幻觉，它把质量瓶颈转向检索、证据选择与生成约束。","proof":"原题明确对照 RAG 与微调在知识更新、可溯源、成本与适用场景上的区别，并强调两者解决的主要问题不同。"}},{"id":"T3","day":2,"order":4,"category":"T","topic":"工具调用","title":"Function Call 能力如何训练？","difficulty":"基础","must":false,"focus":"考察你能否解释Function Call 能力如何训练？ 重点应说清「通过包含工具描述、调用参数和执行反馈的监督样本训练格式与选择能力」，并补充真实项目中的具体取舍。","points":["通过包含工具描述、调用参数和执行反馈的监督样本训练格式与选择能力","再用偏好优化或强化学习提升正确选择与多步使用","评测选工具准确率、参数合法率和最终任务成功率","推理时仍由宿主执行工具"],"answer":"通过包含工具描述、调用参数和执行反馈的监督样本训练格式与选择能力；再用偏好优化或强化学习提升正确选择与多步使用；评测选工具准确率、参数合法率和最终任务成功率；推理时仍由宿主执行工具。","keywords":["监督","参数","反馈","评测"],"source":"https://xiaolinnote.com/ai/tools/3_fc_training.html","sourceDetail":false,"verifiedLink":true,"sourceStatus":"原题文章入口（已核对）","brief":"通过包含工具描述、调用参数和执行反馈的监督样本训练格式与选择能力；再用偏好优化或强化学习提升正确选择与多步使用；评测选工具准确率、参数合法率和最终任务成功率；推理时仍由宿主执行工具。","sourcesite":"小林面试笔记","lesson":{"intro":"模型能输出 tool_calls，并不只是预训练见过 JSON，而是通过结构化对话样本学会“何时、用哪个工具、用哪些参数”，再通过偏好优化提升决策边界。训练样本必须覆盖失败路径。","steps":[["SFT：学习调用格式","收集工具 Schema、User 问题、Assistant tool_calls、Tool 返回和最终 Assistant 回答的完整轨迹，让模型掌握合法调用格式及参数填充。"],["训练数据多样性","正例要包含单工具、多工具、并行调用与多轮上下文；反例要包括无需调用、权限不足、参数非法、接口超时、无可靠数据等。"],["偏好/强化优化","对多个候选行动根据任务成功率、工具成本、越权风险和是否必须调用工具给出偏好反馈，使用适当的偏好优化或 RL 提升工具选择与停止决策。"],["模型评估不能只看 JSON","分别测量工具选择正确率、参数合法率、调用次数/Token、任务成功率、失败恢复、授权违规与重复副作用发生率。"],["推理执行仍需隔离","训练只能让模型发起正确请求，无法赋予它真实 API 权限。执行仍由安全宿主完成，按身份授权与幂等约束运行。"]],"case":"让模型学会“余额可查、转账需审批”：除了成功调用余额查询的轨迹，还必须提供直接回答无需工具、权限不足拒绝转账、工具超时不重复扣费、审批未通过终止的训练/评测样本。","misconception":"“预训练时读过 API 文档就自动具备可靠 Function Calling”不充分；“SFT 只教成功样本”也会造成过度调用或无法处理失败。不同模型可采用 DPO、RL 等不同后训练路线。","proof":"原站区分 SFT 学调用流程与 RLHF 类方法调节调用边界，突出完整轨迹数据与单工具/并行/失败/无需调用等训练场景。"}},{"id":"A3","day":3,"order":0,"category":"A","topic":"Agent","title":"Workflow、Agent、Tools 三者有什么区别？","difficulty":"进阶","must":true,"focus":"考察你能否解释Workflow、Agent、Tools 三者有什么区别？ 重点应说清「Workflow 是预定义的流程图和分支，适合稳定任务」，并补充真实项目中的具体取舍。","points":["Workflow 是预定义的流程图和分支，适合稳定任务","Agent 在运行中由模型动态决定下一步，适合不确定任务","Tools 是可被调用的外部能力，并非独立调度系统","工程上可以采用 Workflow 外壳加 Agent 节点的混合架构"],"answer":"Workflow 是预定义的流程图和分支，适合稳定任务；Agent 在运行中由模型动态决定下一步，适合不确定任务；Tools 是可被调用的外部能力，并非独立调度系统；工程上可以采用 Workflow 外壳加 Agent 节点的混合架构。","keywords":["工作流","动态","工具","混合"],"source":"https://xiaolinnote.com/ai/agent/","sourceDetail":false,"verifiedLink":false,"sourceStatus":"专题目录（原题直链待核）","brief":"Workflow 是预定义的流程图和分支，适合稳定任务；Agent 在运行中由模型动态决定下一步，适合不确定任务；Tools 是可被调用的外部能力，并非独立调度系统；工程上可以采用 Workflow 外壳加 Agent 节点的混合架构。","sourcesite":"小林面试笔记","lesson":{"intro":"本题属于「Agent」工程面试，不能只说出名词。先交代它解决的实际问题，再解释内部机制，最后说明工程上的边界条件、如何验证效果。核心抓手：Workflow 是预定义的流程图和分支，适合稳定任务。","steps":[["关键机制 01","Workflow 是预定义的流程图和分支，适合稳定任务。面试时要说明这样设计的输入是什么、输出是什么，以及为什么这一步不能省略。"],["关键机制 02","Agent 在运行中由模型动态决定下一步，适合不确定任务。面试时要说明这样设计的输入是什么、输出是什么，以及为什么这一步不能省略。"],["关键机制 03","Tools 是可被调用的外部能力，并非独立调度系统。面试时要说明这样设计的输入是什么、输出是什么，以及为什么这一步不能省略。"],["关键机制 04","工程上可以采用 Workflow 外壳加 Agent 节点的混合架构。面试时要说明这样设计的输入是什么、输出是什么，以及为什么这一步不能省略。"]],"case":"假设要把这一能力用于“自动处理企业工单”的 Agent：说明每一步观察什么、需要调用什么工具、失败如何回滚，并明确人工审批节点。","misconception":"不要只背定义，也不要把“能跑通 Demo”当成具备生产可用性。围绕「Agent」说明反例、性能或安全代价、适用与不适用的边界。","proof":"原始专题归于「Agent」。本地要点由题库整理，尚未逐页核实原站对应文章的完整表述，请通过“查阅来源”跳转专题目录核对。"}},{"id":"L4","day":3,"order":1,"category":"L","topic":"LLM 工程","title":"位置编码 sin/cos、RoPE、ALiBi 有何区别？","difficulty":"高级","must":true,"focus":"考察你能否解释位置编码 sin/cos、RoPE、ALiBi 有何区别？ 重点应说清「位置编码向模型提供 Token 顺序信息」，并补充真实项目中的具体取舍。","points":["位置编码向模型提供 Token 顺序信息","绝对 sin/cos 位置编码叠加到表示中","RoPE 旋转 Q/K，使注意力包含相对位置信息","ALiBi 在注意力分数上加距离偏置，关注外推与实际效果"],"answer":"位置编 'use strict';
const PACK=JSON.parse(document.getElementById('appData').textContent);
const BANK=PACK.bank,DAYS=PACK.days,BYID=Object.fromEntries(BANK.map(q=>[q.id,q]));
const SAVE_KEY='fieldnotes_interview_v3',LEGACY='ai_interview_lab_v2_20261017',START='2026-10-17';
const EMPTY=()=>({version:3,records:{},notes:{},started:{},lastQuestion:'A1',updated:null});
const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sDate(){let p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Singapore',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`}
function todayIndex(){let diff=Math.round((Date.parse(sDate()+'T00:00:00Z')-Date.parse(START+'T00:00:00Z'))/86400000);return Math.min(21,Math.max(1,diff+1))}
function dateOf(day){return new Date(Date.parse(START+'T00:00:00Z')+(day-1)*86400000).toISOString().slice(5,10)}
function importLegacy(d){let n=EMPTY();if(!d||d.version!==2)return n;for(let [id,r] of Object.entries(d.results||{})){if(!BYID[id])continue;n.records[id]={text:r.text||'',phase:r.checked?'review':'learn',rubric:[],confidence:r.confidence===2?3:r.confidence===1?2:r.confidence===0?1:0,score:r.score??null,completedAt:r.completedAt||null,attempts:r.completedAt?1:0,followUp:d.notes?.[id]||'',legacy:true,reviewed:!!r.checked}}return n}
function load(){try{let d=JSON.parse(localStorage.getItem(SAVE_KEY));if(d&&d.version===3)return {...EMPTY(),...d};let prior=JSON.parse(localStorage.getItem(LEGACY));if(prior?.version===2){let converted=importLegacy(prior);localStorage.setItem(SAVE_KEY,JSON.stringify(converted));return converted}}catch{}return EMPTY()}
let S=load(),view='learn',selectedDay=todayIndex(),selectedQ=DAYS[selectedDay-1][0],recog=null,allDays=false;
if(BYID[S.lastQuestion]?.day===selectedDay)selectedQ=S.lastQuestion;
const record=id=>S.records[id]||{};
const isDone=q=>!!record(q.id).completedAt;
const doneFor=day=>DAYS[day-1].filter(id=>isDone(BYID[id])).length;
const doneTotal=()=>BANK.filter(isDone).length;
const avg=()=>{let done=BANK.filter(isDone);return done.length?Math.round(done.reduce((acc,q)=>acc+(Number(record(q.id).score)||0),0)/done.length):0};
function toast(message){const e=document.getElementById('toast');if(!e)return;e.textContent=message;e.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>e.classList.remove('show'),2600)}
function save(){S.updated=new Date().toISOString();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch{toast('本地保存失败，请导出备份')}}
function update(id,obj){S.records[id]={...record(id),...obj};S.lastQuestion=id;save()}
function titleForDay(day){const first=BYID[DAYS[day-1][0]];return DAY_THEMES[day-1]||first?.topic||'AI Engineering'}
const DAY_THEMES=['基础与知识闭环','Agent 架构与工具','工作流与工程上下文','ReAct 与 MCP','Agent 执行范式','任务拆解与向量库','记忆与模型微调','多 Agent 与检索','协作、记忆与训练','工程架构与查询改写','规划能力与多路召回','反思机制与缓存','协作协调与量化','上下文工程与图检索','状态恢复与幻觉','死循环与评估','性能排障与更新','并发可靠性与推理服务','任务验证与安全沙箱','生产安全与技术选型','Harness 与工程复盘'];
const ART=['gallery-memory.webp','gallery-retrieval.webp','gallery-workflow.webp'];
const ART_ALT=['黑白古典雕像与钴蓝星空拼贴','钴蓝手势与星球的知识隐喻插画','复古拱门与前进道路的黑白版画'];
function artIndex(q,i){return i%3}
function scrollToEl(id){let el=document.getElementById(id);if(!el)return;const top=Math.max(0,window.scrollY+el.getBoundingClientRect().top-(document.querySelector('.site-header')?.offsetHeight||0)-12);window.scrollTo({top,behavior:'instant'})}
function changeView(v){view=v;render();window.scrollTo({top:0,behavior:'instant'})}
function chooseDay(day){if(day>todayIndex())return toast(`Day ${day} 将在 ${dateOf(day)} 解锁`);selectedDay=day;selectedQ=DAYS[day-1].find(id=>!isDone(BYID[id]))||DAYS[day-1][0];S.lastQuestion=selectedQ;save();view='learn';render();scrollToEl('dailyFocus')}
function chooseQ(id){let q=BYID[id];if(!q||q.day>todayIndex())return;selectedDay=q.day;selectedQ=q.id;S.lastQuestion=q.id;save();view='learn';render();scrollToEl('exercise')}
function previous(){let ids=DAYS[selectedDay-1],i=ids.indexOf(selectedQ);if(i>0)chooseQ(ids[i-1]);else if(selectedDay>1)chooseQ(DAYS[selectedDay-2][4]);else toast('已经是第一题')}
function next(){let ids=DAYS[selectedDay-1],i=ids.indexOf(selectedQ);if(i<4)chooseQ(ids[i+1]);else if(selectedDay<todayIndex())chooseQ(DAYS[selectedDay][0]);else toast('当日五题已是最后一题')}
function sidebarHtml(){const upper=Math.min(21,Math.max(5,selectedDay+1));const lower=Math.max(1,upper-4);const indices=allDays?DAYS.map((_,i)=>i+1):Array.from({length:5},(_,i)=>lower+i);const dayMenu=indices.map(n=>{const ids=DAYS[n-1],locked=n>todayIndex(),cnt=doneFor(n),topic=DAY_THEMES[n-1]||BYID[ids[0]].topic;return `<button class="day-link ${selectedDay===n?'active':''}" ${locked?'disabled':''} onclick="chooseDay(${n})" title="Day ${n} · ${h(topic)}"><span class="day-num">${String(n).padStart(2,'0')}</span><span class="day-name">${h(topic)}</span><span class="day-status">${locked?'—':cnt+'/5'}</span></button>`}).join('');return `<div class="side-title"><span>DAY ${String(selectedDay).padStart(2,'0')}</span><span>FIELD GUIDE</span></div><div class="date-label">2026-${dateOf(selectedDay)} / ${titleForDay(selectedDay)}</div><div class="day-list">${dayMenu}</div><button class="more-days" onclick="allDays=!allDays;document.getElementById('sidebar').innerHTML=sidebarHtml()">${allDays?'收起至 5 天  −':'浏览全部 21 天  +'}</button><hr class="side-separator"><div class="side-section-title">学习阶段</div><div class="side-menu"><button onclick="scrollToEl('dailyFocus')">✥ &nbsp; 深入学习</button><button onclick="scrollToEl('exercise');stage('recall')">✧ &nbsp; 独立口述</button><button onclick="scrollToEl('exercise');stage('review')">♧ &nbsp; 要点核对</button><button onclick="changeView('report')">◎ &nbsp; 自适应巩固</button></div><hr class="side-separator"><div class="side-section-title">学习工具</div><div class="side-menu"><button onclick="changeView('report')">▤ &nbsp; 笔记与学习记录</button><button onclick="downloadBackup()">⇩ &nbsp; 导出 JSON 备份</button></div><hr class="side-separator"><div class="sidebar-mark">Better Questions<br>Lead to<br>Deeper Thinking.</div>`}
function heroHtml(){return `<div class="hero-copy"><div class="micro">FIELDNOTES</div><h1>AI INTERVIEW LAB</h1><p class="hero-lede">用问题，构建你的 AI 竞争力。</p><div class="hero-text">21 天，105 道精选面试题，<br>从基础到实战，带你建立系统化的知识体系。<br>不只是备考，更是思维的进化。</div><div class="hero-kickers"><span>LEARN</span><span>/</span><span>THINK</span><span>/</span><span>BUILD</span><span>/</span><span>GROW</span></div></div><div class="hero-art"><img src="assets/hero-sculpture.webp" alt="从原创艺术案例截取的古典雕塑、钴蓝星图和山峰拼贴" width="1298" height="761" decoding="async" fetchpriority="high"><div class="hero-edge">IDEAS · TOOLS · AGENTS · REAL WORLD</div></div>`}
function galleryHtml(){const today=DAYS[selectedDay-1],n=doneFor(selectedDay);return `<div id="dailyFocus"><section class="daily-callout"><div><div class="micro">TODAY'S TASK &nbsp;/&nbsp; DAY ${String(selectedDay).padStart(2,'0')}</div><h2>AI 面试题 · 5 道精选题</h2><p>${h(titleForDay(selectedDay))} · 每道题都经过知识脉络梳理，覆盖核心考点与真实应用场景。<br>完成今日学习，向更好的自己迈进。</p><div class="action-row"><button class="btn" onclick="scrollToEl('exercise')">开始今日学习 &nbsp; →</button></div></div><blockquote class="callout-quote">“真正的学习，<br>不是记住答案，<br>而是理解问题的本质。”<small>— FIELDNOTES</small></blockquote></section><div class="gallery">${today.slice(0,3).map((id,i)=>{const q=BYID[id];return `<button class="gallery-card" onclick="chooseQ('${id}')" title="${h(q.title)}" aria-label="学习 Day ${selectedDay} 第 ${i+1} 题：${h(q.title)}"><span class="gallery-cover"><img src="assets/${ART[i]}" alt="原创黑白钴蓝复古拼贴画 ${i+1}" width="800" height="340" loading="lazy" decoding="async"></span><span class="gallery-copy"><span class="gallery-head">${String(i+1).padStart(2,'0')} &nbsp; / &nbsp; ${h(q.topic)}</span><strong class="gallery-title">${h(q.title)}</strong><span class="gallery-desc">${h(q.focus.slice(0,62))}${q.focus.length>62?'…':''}</span><span class="gallery-foot"><span>${isDone(q)?'复习已完成题目':'开始深入学习'} →</span><b>↗</b></span></span></button>`}).join('')}</div><div class="all-five"><div class="all-five-title"><h3>今日完整题单</h3><span>DAY ${String(selectedDay).padStart(2,'0')} &nbsp;/&nbsp; ${n} OF 5 COMPLETE</span></div>${today.map((id,i)=>{const q=BYID[id];return `<button class="five-row ${selectedQ===id?'current':''}" onclick="chooseQ('${id}')"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="text">${h(q.title)}</span><span class="meta">${isDone(q)?'✓ 已完成':q.must?'★ 熟练口述':'理解 / 口述'} &nbsp;↗</span></button>`}).join('')}</div></div>`}
function label(q){return q.difficulty==='高级'?'ADVANCED':q.difficulty==='进阶'?'INTERMEDIATE':'FOUNDATION'}
function stage(p){if(p==='review'&&!record(selectedQ).reviewed)return toast('请先提交口述答案');update(selectedQ,{phase:p});renderExercise()}
function learnHtml(q){const lesson=q.lesson||{};const steps=lesson.steps||[];return `<section class="lesson-block"><div class="micro blue">01 / THE WHY</div><h3>先理解它为什么存在</h3><p>${h(lesson.intro||q.focus)}</p></section><section class="lesson-block"><div class="micro blue">02 / UNDER THE HOOD</div><h3>原理拆解 · 从输入到输出</h3>${steps.map(([title,desc],i)=>`<div class="lesson-step"><span>${String(i+1).padStart(2,'0')}</span><div><strong>${h(title)}</strong><p>${h(desc)}</p></div></div>`).join('')}</section><section class="lesson-block"><div class="micro blue">03 / FIELD APPLICATION</div><h3>放到工程项目中如何解释？</h3><p>${h(lesson.case||q.focus)}</p></section><section class="lesson-block"><div class="micro blue">04 / COMMON FAILURE</div><h3>面试中最容易忽略什么？</h3><p>${h(lesson.misconception||'不能只背定义，还应解释边界与实际取舍。')}</p></section><div class="note">建议先独立讲清“它解决什么问题、内部怎样运行、真实工程如何落地”，然后再进入口述，不要把记住几个术语误认为掌握。</div><div class="action-row"><button class="btn primary" onclick="stage('recall')">理解了，开始脱稿口述 ↗</button></div>`}
function recallHtml(q){const r=record(q.id);return `<section class="lesson-block"><div class="micro blue">CLOSED BOOK / IN YOUR OWN WORDS</div><h3>请模拟面试官，完整讲述这道题</h3><p>建议用 60–120 秒：先讲原理，再说执行流程、一个真实项目情景，以及一个容易踩的坑。此阶段不会提前展示答案。</p><label class="micro" for="oral" style="display:block;margin-top:22px">口述内容 / YOUR RESPONSE</label><textarea id="oral" class="answer-input" oninput="draftOral(this.value)" placeholder="请用自己的话写下口述要点，也可以尝试语音转写…">${h(r.text||'')}</textarea><div class="action-row"><button class="btn" onclick="dictate()">◉ 语音转写</button><button class="btn primary" onclick="checkOral()">提交口述并核对 ↗</button><button class="btn" onclick="stage('learn')">返回深入学习</button></div><p style="font-size:11px;color:var(--dim);margin-top:17px">口述保存于当前浏览器，不会上传 GitHub。语音识别依赖浏览器支持及权限。</p></section>`}
function draftOral(text){update(selectedQ,{text})}
function checkOral(){let t=document.getElementById('oral')?.value.trim();if(!t||t.length<15)return toast('请至少写 15 字，描述原理与因果');update(selectedQ,{text:t,reviewed:true,phase:'review',firstReviewedAt:record(selectedQ).firstReviewedAt||new Date().toISOString()});renderExercise()}
function keywordCoverage(q,r){let t=String(r.text||'').toLowerCase(),kw=q.keywords||[];return {count:kw.filter(k=>t.includes(k.toLowerCase())).length,total:kw.length,missing:kw.filter(k=>!t.includes(k.toLowerCase()))}}
function setCheck(index,checked){let r=record(selectedQ),rubric=new Set(r.rubric||[]);checked?rubric.add(index):rubric.delete(index);update(selectedQ,{rubric:[...rubric]});renderExercise()}
function setConfidence(n){update(selectedQ,{confidence:n});renderExercise()}
function finishReview(){let q=BYID[selectedQ],r=record(selectedQ),points=q.points||[],kc=keywordCoverage(q,r);let coverage=points.length?(r.rubric||[]).length/points.length:0;let score=Math.round(70*coverage+15*(kc.total?kc.count/kc.total:1)+15*((r.confidence||0)/3));update(selectedQ,{phase:'review',score,completedAt:new Date().toISOString(),attempts:(r.attempts||0)+1});render();scrollToEl('exercise');toast(score>=80?'掌握度较好，可继续深入追问':'已保存学习反馈，建议巩固薄弱项')}
function reviewHtml(q){let r=record(q.id);if(!r.reviewed)return `<div class="note">先提交口述，才能展开答案核对。</div><button class="btn primary" onclick="stage('recall')">开始口述 →</button>`;let kc=keywordCoverage(q,r);return `<section class="lesson-block"><div class="micro blue">YOUR ANSWER / 独立作答</div><h3>你刚才的回答</h3><div class="reference-answer" style="white-space:pre-wrap">${h(r.text)}</div><div class="note">自动检测仅是关键词覆盖提示，不是 AI 语义评审；同义表达、概念错误和逻辑矛盾需要你自己核对。</div><p>识别关键词 ${kc.count}/${kc.total} · 未识别：${h(kc.missing.join('、')||'无')}（可能使用了不同措辞）</p></section><section class="lesson-block"><div class="micro blue">SELF-ASSESSMENT / 答题要点</div><h3>检查是否真正解释清楚</h3><div class="checklist">${(q.points||[]).map((p,i)=>`<label class="check-item"><input type="checkbox" ${ (r.rubric||[]).includes(i)?'checked':''} onchange="setCheck(${i},this.checked)"><span>${h(p)}</span></label>`).join('')}</div></section><section class="lesson-block"><div class="micro blue">REFERENCE / 本站整理</div><h3>参考回答 · 精简口述版</h3><div class="reference-answer">${h(q.brief||q.answer)}</div><p>参考答案由本站独立整理，并非原站逐字复刻。请在下方核对出处。</p></section><section class="lesson-block"><div class="micro blue">CONFIDENCE / 实际熟练度</div><h3>这道题能脱稿讲清吗？</h3><div class="action-row">${[[1,'需要补基础'],[2,'理解但不流利'],[3,'能够流利口述']].map(([n,t])=>`<button class="btn ${(r.confidence||0)===n?'primary':''}" onclick="setConfidence(${n})">${t}</button>`).join('')}</div><div class="note">${h(q.quiz?.follow||'尝试补充一个边界条件：在真实业务中，该方案可能在哪些情况下失效？')}</div><div class="action-row"><button class="btn primary" onclick="finishReview()">保存本题反馈 ↗</button><button class="btn" onclick="stage('recall')">重新口述</button></div>${r.completedAt?`<p style="margin-top:15px;color:var(--blue)">已记录掌握度 ${Number(r.score)||0}/100 · ${Number(r.score)>=80?'继续挑战下一题':'建议补充薄弱知识点'}</p>`:''}</section>`}
function sourceHtml(q){return `<div class="source-box"><div class="micro blue">SOURCE VERIFICATION / 原站依据</div><p><strong>${h(q.sourcesite||'小林面试笔记')}</strong> · ${h(q.sourceStatus||'待逐题核验')}</p><p>${h(q.lesson?.proof||'题目选取和解答框架参考相关专题，本站整理不是原文逐字复制。')} ${q.verifiedLink?'当前提供对应文章入口。':'目前仅有原站专题入口，不能视为已核对完整原题。'}</p><a href="${h(q.source||'https://xiaolinnote.com/ai/')}" target="_blank" rel="noopener noreferrer">${q.verifiedLink?'查看原站完整文章 ↗':'打开原站专题目录 ↗'}</a></div>`}
function exerciseHtml(){let q=BYID[selectedQ],r=record(q.id),phase=r.phase||'learn';if(phase==='review'&&!r.reviewed)phase='learn';return `<div class="exercise-pad"><div class="exercise-top"><div class="micro">QUESTION ${String(q.order+1).padStart(2,'0')} / 05</div><div class="micro blue">${h(q.topic)} / ${label(q)} ${q.must?'· ★ 必掌握':''}</div></div><div class="exercise-head"><div><div class="micro">DAY ${String(q.day).padStart(2,'0')} · DEEP STUDY</div><h2>${h(q.title)}</h2><p class="exercise-intro">${h(q.focus)}</p></div><img class="q-wing" src="assets/editorial-wing.webp" alt="" aria-hidden="true" loading="lazy"></div><div class="q-strip">${DAYS[selectedDay-1].map((id,i)=>`<button class="${selectedQ===id?'active':''} ${isDone(BYID[id])?'done':''}" title="${h(BYID[id].title)}" aria-label="第 ${i+1} 题" onclick="chooseQ('${id}')">${String(i+1).padStart(2,'0')}</button>`).join('')}</div><div class="stage-tabs"><button class="${phase==='learn'?'active':''}" onclick="stage('learn')">01 / 深入学习</button><button class="${phase==='recall'?'active':''}" onclick="stage('recall')">02 / 独立口述</button><button ${!r.reviewed?'disabled':''} class="${phase==='review'?'active':''}" onclick="stage('review')">03 / 要点核对</button></div><div id="studyBody">${phase==='review'?reviewHtml(q):phase==='recall'?recallHtml(q):learnHtml(q)}</div></div>${sourceHtml(q)}<div class="foot-pager"><span>${h(q.id)} · 已存入当前浏览器 · ${dateOf(q.day)}</span><div><button onclick="previous()">← 上一题</button><button onclick="next()">下一题 →</button></div></div>`}
function renderExercise(){let el=document.getElementById('exercise');if(el)el.innerHTML=exerciseHtml();renderAside()}
function asideHtml(){const done=doneFor(selectedDay),score=avg();return `<section class="progress-section"><div class="card-cap"><strong>学习进度</strong><span>DAY ${String(selectedDay).padStart(2,'0')} / 21</span></div><div class="progress-top"><div class="progress-circle" style="--pct:${(done/5*360-90)}deg"><strong>${done}/5</strong><span>已完成</span></div><div class="progress-list">${DAYS[selectedDay-1].map((id,i)=>`<button class="${id===selectedQ?'current':''}" onclick="chooseQ('${id}')"><i class="${isDone(BYID[id])?'filled':''}"></i>题目 ${i+1}</button>`).join('')}</div></div></section><section class="progress-section"><div class="card-cap"><strong>今日学习目标</strong><span>GOAL 05</span></div><div class="flowline"><div class="step"><span>✧</span><div><strong>5 道面试题</strong><p>深入学习 · 独立口述 · 要点核对 · 自适应巩固</p></div></div></div><div class="stats-row"><div><strong>${doneTotal()}</strong><small>累计完成 / 105</small></div><div><strong>${score}</strong><small>平均掌握度</small></div></div></section><blockquote class="callout-quote" style="font-size:13px;margin:26px 0 20px">“每天进步一点点，<br>未来会感谢现在的你。”</blockquote><div class="aside-actions"><button class="btn" onclick="changeView('report')">学习报告 ↗</button><button class="btn" onclick="downloadBackup()">导出备份 ⇩</button></div>`}
function renderAside(){const e=document.getElementById('rightAside');if(e)e.innerHTML=asideHtml()}
function reportHtml(){let low=BANK.filter(q=>isDone(q)&&(record(q.id).score||0)<70).sort((a,b)=>(record(a.id).score||0)-(record(b.id).score||0));return `<section class="report"><div class="report-hero"><div class="micro blue">LEARNING ARCHIVE</div><h2>让进步<br><em>有迹可循。</em></h2><p style="margin:14px 0 29px">学习记录只保存在当前浏览器。掌握度来自要点自评和关键词覆盖，不是联网 AI 语义评分。</p></div><div class="report-grid"><div class="scorebox"><strong>${doneTotal()}</strong><small>已完成题目 / 105</small></div><div class="scorebox"><strong>${avg()}</strong><small>平均自评掌握度 / 100</small></div></div><h2 style="font-size:29px;margin:40px 0 10px">待复习 · 知识弱项</h2>${low.length?low.slice(0,30).map(q=>`<div class="review-item"><button onclick="chooseQ('${q.id}')">${h(q.title)}</button><span>${record(q.id).score||0}/100 →</span></div>`).join(''):'<div class="note">目前还没有低掌握度记录。</div>'}<h2 style="font-size:29px;margin:40px 0 10px">每日学习进度</h2>${DAYS.map((ids,i)=>`<div class="review-item"><button onclick="chooseDay(${i+1})" ${i+1>todayIndex()?'disabled':''}>DAY ${String(i+1).padStart(2,'0')} · ${h(BYID[ids[0]].topic)}</button><span>${doneFor(i+1)}/5</span></div>`).join('')}<div class="action-row"><button class="btn primary" onclick="downloadBackup()">导出备份</button><label class="btn">导入备份<input hidden type="file" accept="application/json" onchange="uploadBackup(event)"></label><button class="btn" onclick="resetAll()">清空记录</button></div></section>`}
function infoHtml(){return `<section class="info"><div class="info-hero"><div class="micro blue">ABOUT FIELDNOTES / FIELD GUIDE</div><h2>问题是开始。<br><em>理解才是答案。</em></h2></div><h3 style="font-size:29px;margin:32px 0 12px">如何使用</h3><p>每天解锁 5 道题。选择某天后，该日题目推荐、索引、学习区域和进度统计会同步更新。建议先读原理，再脱稿口述，最后自评与核对原站资料；熟练后再做深入追问。</p><h3 style="font-size:29px;margin:32px 0 12px">来源与权利说明</h3><p>特别致谢 <a href="https://xiaolinnote.com/ai/" target="_blank" rel="noopener noreferrer">小林面试笔记及其创作者小林</a>。项目的题目线索和主题来源参考其专栏；本站为独立非官方学习工具，未声称获得转载授权，原作者保留原始文章及图片的相应权利。网站上的辅助讲解不能视为原站逐字答案。</p><p>完整说明见 <a href="https://github.com/HardZionL/ai-interview-lab/blob/main/SOURCES.md" target="_blank" rel="noopener noreferrer">SOURCES.md</a> 和 <a href="https://github.com/HardZionL/ai-interview-lab/blob/main/CONTRIBUTORS.md" target="_blank" rel="noopener noreferrer">CONTRIBUTORS.md</a>。</p><h3 style="font-size:29px;margin:32px 0 12px">隐私与功能边界</h3><p>学习内容和口述文本保存在浏览器 localStorage，不会自动上传至 GitHub，也不会跨设备实时同步；更换浏览器或域名前，请导出 JSON 手动备份。自适应学习基于规则与自评，不是大模型在线评分。</p><div class="action-row"><button class="btn primary" onclick="changeView('learn')">返回学习</button><button class="btn" onclick="downloadBackup()">导出个人数据</button></div></section>`}
function render(){document.querySelectorAll('.nav-btn').forEach(el=>el.classList.toggle('active',el.dataset.view===view));document.getElementById('sidebar').innerHTML=sidebarHtml();document.getElementById('hero').innerHTML=heroHtml();const m=document.getElementById('focusMain');if(view==='learn')m.innerHTML=galleryHtml()+`<div id="exercise" class="exercise">${exerciseHtml()}</div>`;else m.innerHTML=view==='report'?reportHtml():infoHtml();renderAside()}
function downloadBackup(){const blob=new Blob([JSON.stringify({app:'Fieldnotes AI Interview Studio',exportedAt:new Date().toISOString(),data:S},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Fieldnotes_学习备份_'+sDate()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('已导出个人学习记录')}
async function uploadBackup(e){const f=e.target.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text()),d=parsed.data||parsed,imp=d.version===2?importLegacy(d):d;if(imp.version!==3||!imp.records||typeof imp.records!=='object')throw Error('备份格式或版本不正确');if(!confirm('导入会覆盖当前浏览器学习记录，是否继续？'))return;S={...EMPTY(),...imp};save();render();toast('记录已恢复')}catch(err){toast('导入失败：'+err.message)}finally{e.target.value=''}}
function resetAll(){if(!confirm('确定清空所有本地学习记录？建议先导出备份。'))return;S=EMPTY();save();render();toast('学习记录已清空')}
function dictate(){const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){toast('当前浏览器不支持语音转写');return}if(recog){try{recog.stop()}catch{}return}recog=new SpeechRecognition();recog.lang='zh-CN';recog.interimResults=false;recog.onresult=event=>{let t=document.getElementById('oral');if(!t)return;let part=event.results[0][0].transcript;t.value=(t.value?t.value+'\n':'')+part;draftOral(t.value)};recog.onerror=e=>{toast('语音识别不可用：'+e.error);recog=null};recog.onend=()=>recog=null;try{recog.start();toast('正在聆听…')}catch(e){toast('无法启动麦克风');recog=null}}
render();

</script></body></html>
